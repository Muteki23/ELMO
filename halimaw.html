<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elmo Dance</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ff4d4d, #ffb347);
      overflow:hidden;
    }

    .container{
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:400px;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
      animation: pop 0.6s ease;
    }

    @keyframes pop{
      from{
        transform:scale(0.5);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    h1{
      color:#ff3333;
      margin-bottom:20px;
    }

    p{
      margin-bottom:25px;
      color:#444;
      font-size:18px;
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:20px;
    }

    button{
      padding:12px 30px;
      border:none;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      color:white;
      font-weight:bold;
    }

    .yes{
      background:#28a745;
    }

    .no{
      background:#dc3545;
    }

    button:hover{
      transform:scale(1.1);
    }

    .dance-page{
      display:none;
      flex-direction:column;
      align-items:center;
      animation:fade 1s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
      }
      to{
        opacity:1;
      }
    }

    .dance-page img{
      width:300px;
      border-radius:20px;
      margin-top:20px;
      animation:dance 0.7s infinite alternate;
      box-shadow:0 10px 20px rgba(0,0,0,0.4);
    }

    @keyframes dance{
      from{
        transform:rotate(-8deg) translateY(0px);
      }
      to{
        transform:rotate(8deg) translateY(-15px);
      }
    }

    .dance-text{
      color:white;
      font-size:35px;
      font-weight:bold;
      text-shadow:2px 2px 10px black;
    }
  </style>
</head>

<body>

  <!-- FIRST PAGE -->
  <div class="container" id="questionBox">
    <h1>Do You Love Elmo?</h1>
    <p>Press Yes or No</p>

    <div class="buttons">
      <button class="yes" onclick="showDance()">YES</button>
      <button class="no" onclick="showDance()">NO</button>
    </div>
  </div>

  <!-- DANCE PAGE -->
  <div class="dance-page" id="dancePage">
    <div class="dance-text">ELMO IS DANCING 💃🔥</div>

    <!-- Put your Elmo image file here -->
    <img src="elmo.jpg" alt="Elmo Dancing">
  </div>

  <script>
    function showDance(){
      document.getElementById("questionBox").style.display = "none";
      document.getElementById("dancePage").style.display = "flex";
    }
  </script>

</body>
</html>
